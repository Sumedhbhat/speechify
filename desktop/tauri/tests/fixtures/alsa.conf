# Every capture PCM is synthetic. Physical cards may be queried for device
# names through ctl.hw, but this configuration cannot open their microphones.
defaults.namehint.showall on
pcm.!default { type null hint { show on description "Speechify synthetic microphone" } }
pcm.speechify_test { type null hint { show on description "Speechify test input" } }
pcm.speechify_f32 { type speechify_fixture format FLOAT_LE hint.description "Speechify float input" }
pcm.speechify_i16 { type speechify_fixture format S16_LE hint.description "Speechify signed input" }
pcm.speechify_u16 { type speechify_fixture format U16_LE hint.description "Speechify unsigned input" }
pcm.speechify_i8 { type speechify_fixture format S8 hint.description "Speechify unsupported input" }
pcm.speechify_f32_lost { type speechify_fixture format FLOAT_LE behavior disconnect hint.description "Speechify float disconnect" }
pcm.speechify_i16_lost { type speechify_fixture format S16_LE behavior disconnect hint.description "Speechify signed disconnect" }
pcm.speechify_u16_lost { type speechify_fixture format U16_LE behavior disconnect hint.description "Speechify unsigned disconnect" }
pcm.speechify_f32_prepare { type speechify_fixture format FLOAT_LE behavior prepare-error hint.description "Speechify float setup error" }
pcm.speechify_i16_prepare { type speechify_fixture format S16_LE behavior prepare-error hint.description "Speechify signed setup error" }
pcm.speechify_u16_prepare { type speechify_fixture format U16_LE behavior prepare-error hint.description "Speechify unsigned setup error" }
pcm.speechify_start_error { type speechify_fixture format FLOAT_LE behavior start-error hint.description "Speechify start error" }
ctl.hw {
    @args [ CARD ]
    @args.CARD { type string default "0" }
    type hw
    card $CARD
}
