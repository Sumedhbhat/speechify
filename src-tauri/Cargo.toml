[package]
name = "speechify"
version = "0.1.0"
edition = "2021"
default-run = "speechify"
[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon", "image-png"], optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
toml = { version = "=0.9.8" }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
reqwest = { version = "=0.13.5", features = ["blocking", "json", "rustls"], default-features = false }
sha2 = { version = "=0.11.1" }
libloading = { version = "=0.9.0" }
hound = { version = "=3.5.1" }
cpal = { version = "=0.18.2", optional = true }
libc = { version = "=0.2.190" }
regex = { version = "=1.13.1" }
base64 = { version = "=0.23.1" }
tauri-plugin-single-instance = { version = "=2.5.4", optional = true }
[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:cpal", "dep:tauri-plugin-single-instance"]
behavioral-tests = ["desktop", "tauri/test"]
[profile.dev]
debug = 0
incremental = false
[profile.release]
debug = 0
strip = true
lto = "thin"
codegen-units = 8
