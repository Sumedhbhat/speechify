[package]
name = "speechify-perf"
description = "The performance gate: speed of the default models and the cleanup scenarios, as JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "perf"
path = "src/main.rs"

[dependencies]
speechify-core = { path = "../core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
