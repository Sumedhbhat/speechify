name: Tauri candidate packages

on:
  push:
    branches: [main, sb/tauri-candidate-implementation]
    paths: ['desktop/tauri/**', '.github/workflows/tauri-candidate.yml']
  pull_request: {}
  workflow_dispatch:
    inputs:
      coverage_only:
        description: Run behavioral tests and coverage without building installer bundles
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Tauri behavioral coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        working-directory: desktop/tauri
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: desktop/tauri/package-lock.json
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libx11-dev libxtst-dev xvfb xauth xclip xdotool dbus libglib2.0-bin
      - name: Install coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo install rustfilt --version 0.2.0 --locked
          npm ci
      - name: Prepare isolated Wayland keyboard directory
        if: runner.os == 'Linux'
        run: |
          test ! -e /dev/input/by-id
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 700 /dev/input/by-id
      - name: Exercise application behavior and collect native coverage
        env:
          PYTHON: python
          SPEECHIFY_TEST_DISPOSABLE_DESKTOP: '1'
          SPEECHIFY_TEST_VIRTUAL_KEYBOARD: '1'
        run: bash scripts/test-coverage.sh --collect-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tauri-coverage-${{ matrix.os }}
          path: desktop/tauri/coverage/
          if-no-files-found: error
          retention-days: 14

  coverage-gate:
    name: Tauri full coverage gate
    needs: coverage
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require passing behavioral suites on every platform
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: test "$COVERAGE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: tauri-coverage-*
          path: coverage-results
      - name: Require full coverage across supported platforms
        run: |
          cargo install rustfilt --version 0.2.0 --locked
          python3 desktop/tauri/scripts/check-coverage.py \
            --frontend coverage-results/tauri-coverage-ubuntu-24.04/coverage-final.json \
            --backend coverage-results/tauri-coverage-*/rust.info

  linux:
    if: github.event_name != 'workflow_dispatch' || !inputs.coverage_only
    name: Tauri Linux package and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop/tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: desktop/tauri/package-lock.json
      - name: Install desktop build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libx11-dev libxtst-dev
      - name: Prepare locked dependencies and pinned native runtime
        run: |
          npm ci
          python3 scripts/prepare-native.py
      - name: Test desktop backend and optional installer
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          python3 scripts/test-optional-installer.py
      - name: Build Debian and portable packages
        run: |
          npm run tauri -- build --ci --bundles deb -- --locked
          python3 scripts/package-portable.py
          (cd artifacts/speechify-tauri-candidate-linux-x86_64 && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: speechify-tauri-linux-candidate
          path: |
            desktop/tauri/artifacts/*.tar.gz
            desktop/tauri/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  mac:
    if: github.event_name != 'workflow_dispatch' || !inputs.coverage_only
    name: macOS candidate package (no release)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop/tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: desktop/tauri/package-lock.json
      - name: Record build host
        run: |
          uname -a
          sw_vers
          rustc --version
          cargo --version
      - name: Prepare locked dependencies and pinned native runtime
        run: |
          npm ci
          python3 scripts/prepare-native.py
      - name: Test
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features
          python3 scripts/test-optional-installer.py
      - name: Build app
        run: npm run tauri -- build --ci --bundles app -- --locked
      - name: Sign local candidate and create disk image
        run: |
          bundle='src-tauri/target/release/bundle/macos/Speechify Tauri Candidate.app'
          codesign --force --deep --sign - --entitlements src-tauri/Entitlements.plist "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          mkdir -p artifacts/dmg-stage
          cp -R "$bundle" artifacts/dmg-stage/
          ln -s /Applications artifacts/dmg-stage/Applications
          hdiutil create -volname 'Speechify Tauri Candidate' -srcfolder artifacts/dmg-stage -ov -format UDZO artifacts/speechify-tauri-candidate-mac-arm64.dmg
          (cd artifacts && shasum -a 256 *.dmg > SHA256SUMS && shasum -a 256 -c SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > artifacts/SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: speechify-tauri-macos-candidate
          path: |
            desktop/tauri/artifacts/*.dmg
            desktop/tauri/artifacts/SHA256SUMS
            desktop/tauri/artifacts/SOURCE-COMMIT.txt
          if-no-files-found: error
          retention-days: 14
