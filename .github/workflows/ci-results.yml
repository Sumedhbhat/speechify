name: CI for a results commit

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  test:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [Test (ubuntu-24.04), Test (macos-15), Test (windows-2025)]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reuse the result from the measured commit
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK: ${{ matrix.check }}
        run: bash scripts/check-results-commit.sh "$CHECK"

  coverage-gate:
    name: Tauri full coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reuse the result from the measured commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-results-commit.sh "Tauri full coverage gate"
