name: Dependabot security fixes

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HAS_ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN != '' }}
    steps:
      # GITHUB_TOKEN can't read Dependabot alerts, so without this secret no PR
      # can be recognised as a security fix and nothing is auto-merged.
      - if: env.HAS_ALERTS_TOKEN != 'true'
        run: echo "::warning::DEPENDABOT_ALERTS_TOKEN is not set, so security fixes won't auto-merge. See docs/releases.md."

      - id: meta
        if: env.HAS_ALERTS_TOKEN == 'true'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          alert-lookup: true
          github-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}

      # Patch and minor security fixes: merge as soon as required checks pass.
      - if: steps.meta.outputs.ghsa-id != '' && steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"

      # Major security fixes: open now, but a person reviews them the same day.
      - if: steps.meta.outputs.ghsa-id != '' && steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh label create security-major --color B60205 --description "Major-version security fix, needs same-day review" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label security-major
