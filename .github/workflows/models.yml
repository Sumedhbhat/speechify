name: Models

# Installs every speech model in its own environment on Windows and checks it
# transcribes the self-test clip accurately. Runners have no GPU, so this
# proves each recipe and its dependencies work, not GPU speed. Windows installs
# the CUDA packages (as on an RTX PC); Linux and macOS, where one model per
# backend is checked, install the CPU ones, as on a machine without NVIDIA.
# Pull requests run the smaller set described at the plan job.
#
# On Linux and macOS the existing backends run with --device cpu, as on a
# machine without a GPU ("auto" would pick Metal on a Mac). Jobs with
# device vulkan or metal run the model's transcribe.cpp (GGUF)
# build, the way an AMD/Intel PC or a Mac does. The runners have no usable
# GPU, so they also prove the fallback: transcribe.cpp moves to the CPU by
# itself and the clip is still transcribed. (macOS runners have a
# "Paravirtual" Metal device, which GgmlEngine skips because it garbles Whisper.)

on:
  push:
    branches: [main, "release/**"]
    paths: [src/speechify/engines/**, .github/workflows/models.yml]
  pull_request:
    paths: [src/speechify/engines/**, .github/workflows/models.yml]
  schedule:
    - cron: "41 3 * * 1"            # weekly: catches upstream breakage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests check one model per backend on Windows and Linux, so a PR
  # isn't kept waiting on the big models or the few macOS runners. Everything
  # else (main, release branches, the weekly run) checks the full matrix.
  plan:
    name: Choose models
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          matrix=$(jq -nc --arg event "$EVENT" '
            ["whisper-large-v3-turbo", "parakeet-tdt-0.6b-v3", "moonshine-base", "qwen3-asr-0.6b"] as $per_backend
            | ["whisper-large-v3-turbo", "whisper-large-v3", "distil-whisper-large-v3",
               "parakeet-tdt-0.6b-v3", "parakeet-tdt-0.6b-v2", "canary-1b-v2",
               "granite-speech-4.1-2b", "cohere-transcribe", "qwen3-asr-1.7b", "qwen3-asr-0.6b",
               "voxtral-mini-3b", "kyutai-stt-2.6b", "kyutai-stt-1b", "moonshine-base"] as $all
            | ["parakeet-tdt-0.6b-v3", "parakeet-tdt-0.6b-v2", "canary-1b-v2",
               "whisper-large-v3-turbo", "whisper-large-v3", "qwen3-asr-0.6b", "qwen3-asr-1.7b",
               "cohere-transcribe", "granite-speech-4.1-2b", "voxtral-mini-3b", "moonshine-base"] as $all_gguf
            | ["parakeet-tdt-0.6b-v3", "whisper-large-v3-turbo", "qwen3-asr-0.6b", "moonshine-base"] as $per_family
            | (if $event == "pull_request"
               then {"windows-2025": $per_backend, "ubuntu-24.04": $per_backend}
               else {"windows-2025": $all, "ubuntu-24.04": $per_backend, "macos-15": $per_backend}
               end) as $native
            | (if $event == "pull_request"
               then {"ubuntu-24.04": $per_family, "windows-2025": ["parakeet-tdt-0.6b-v3"]}
               else {"ubuntu-24.04": $all_gguf, "windows-2025": ["parakeet-tdt-0.6b-v3"],
                     "macos-15": ["parakeet-tdt-0.6b-v3", "whisper-large-v3-turbo"]}
               end) as $gguf
            | {include: ([$native | to_entries[] | .key as $os | .value[]
                          | {os: $os, model: ., device: (if $os == "windows-2025" then "" else "cpu" end)}]
                       + [$gguf | to_entries[] | .key as $os | .value[]
                          | {os: $os, model: ., device: (if $os == "macos-15" then "metal" else "vulkan" end)}])}')
          echo "$matrix" | jq -c '.include[]'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  engine:
    name: ${{ matrix.model }} (${{ matrix.os }}${{ matrix.device && format(', {0}', matrix.device) || '' }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}  # only needed for the gated Cohere model
      # Windows runners have no NVIDIA driver; install the CUDA packages anyway,
      # as on an RTX PC, except in the transcribe.cpp jobs.
      SPEECHIFY_CUDA: ${{ matrix.os == 'windows-2025' && !matrix.device && '1' || '' }}

    steps:
      # D: on Windows has the most room; elsewhere the home folder does.
      - name: Cache locations
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then root='D:\speechify'; sep='\'; else root=$HOME/speechify; sep=/; fi
          {
            echo "SPEECHIFY_ENGINES=$root${sep}engines"
            echo "UV_PYTHON_INSTALL_DIR=$root${sep}python"
            echo "HF_HOME=$root${sep}hf"
          } >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"

      - name: Install
        run: uv sync --frozen --no-dev

      # The GGUF builds aren't gated, so Cohere runs on transcribe.cpp without a token.
      - name: Self-test ${{ matrix.model }}
        if: matrix.model != 'cohere-transcribe' || env.HF_TOKEN != '' || matrix.device == 'vulkan' || matrix.device == 'metal'
        run: >-
          uv run --frozen --no-dev speechify selftest --engine-only --model ${{ matrix.model }} --out report
          ${{ matrix.device && format('--device {0}', matrix.device) || '' }}

      - name: Gated model skipped
        if: matrix.model == 'cohere-transcribe' && env.HF_TOKEN == '' && matrix.device != 'vulkan' && matrix.device != 'metal'
        shell: bash
        run: |
          echo "::warning::Skipped ${{ matrix.model }}, which is gated. Add an HF_TOKEN secret from an account that accepted its terms."

      - name: Summary
        if: always()
        shell: bash
        run: cat report/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-${{ matrix.model }}-${{ matrix.os }}${{ matrix.device && format('-{0}', matrix.device) || '' }}
          path: report
          if-no-files-found: ignore
          retention-days: 14
