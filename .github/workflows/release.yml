name: Release

# Nightly prereleases come from main and stable releases from release/X.Y branches.
# See docs/releases.md.

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Let every push to a release branch finish so no patch release is skipped.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version and channel
        id: version
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          case "$GITHUB_REF" in
            refs/heads/release/*)
              line="${GITHUB_REF#refs/heads/release/}"
              case "$line" in
                *.*.*) echo "Name release branches release/<major>.<minor>, not release/$line." >&2; exit 1 ;;
              esac
              case "$manifest" in
                "$line".*) ;;
                *) echo "pyproject.toml version $manifest does not belong to release/$line." >&2; exit 1 ;;
              esac
              channel=stable
              version="$manifest"
              ;;
            refs/heads/main)
              channel=nightly
              version="$manifest-nightly.$GITHUB_RUN_NUMBER"
              ;;
            *)
              channel=none
              version="$manifest-dev.$GITHUB_RUN_NUMBER"
              ;;
          esac
          echo "Building $version ($channel)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  package:
    name: Build ${{ matrix.platform }} installer
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
          - platform: macos
            os: macos-15
          # The oldest supported runner, so the Linux build runs on any glibc
          # from 2.35 (Ubuntu 22.04, Debian 12, Fedora 36) up.
          - platform: linux
            os: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Install ALSA headers for PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: |
          curl -fsSL https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -o innosetup.exe
          echo "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732  innosetup.exe" | sha256sum -c -
          ./innosetup.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART //SP- '//DIR=C:\innosetup'
          echo "ISCC=C:/innosetup/ISCC.exe" >> "$GITHUB_ENV"

      - name: Build
        run: packaging/build.sh "$VERSION"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Installs what users download, on a fresh runner, and runs the default
  # model through it: the app's own Python, the uv it ships with, and the
  # model environment uv builds. No GPU on these runners, so this is the setup
  # a Mac or a PC without an NVIDIA card gets.
  check-package:
    name: Install and self-test (${{ matrix.platform }})
    needs: [version, package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2025
          - platform: macos
            os: macos-15
          - platform: linux
            os: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash

    steps:
      # Outside the workspace so actions/cache can keep model environments,
      # the Python they point at, and the downloaded weights between runs.
      - name: Cache locations
        run: |
          if [ "$RUNNER_OS" = Windows ]; then cache='C:\speechify-cache'; else cache=$HOME/speechify-cache; fi
          {
            echo "CACHE_DIR=$cache"
            echo "SPEECHIFY_ENGINES=$cache/engines"
            echo "UV_PYTHON_INSTALL_DIR=$cache/python"
            echo "HF_HOME=$cache/hf"
          } >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: src/speechify/engines/catalog.py

      - name: Download installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-${{ matrix.platform }}
          path: dist

      - name: Restore model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_DIR }}
          key: package-engine-${{ runner.os }}-${{ hashFiles('src/speechify/engines/catalog.py') }}

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/Speechify-*-windows-x64-setup.exe
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait
          # The console build; Speechify.exe has no console to print to.
          "APP=$env:LOCALAPPDATA\Programs\Speechify\speechify.com" >> $env:GITHUB_ENV
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Speechify\Speechify.exe")) { throw "No Speechify.exe" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Programs'))\Speechify.lnk")) { throw "No Start menu shortcut" }

      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -mountpoint /Volumes/Speechify dist/Speechify-*-macos-*.dmg
          cp -R /Volumes/Speechify/Speechify.app /Applications/
          hdiutil detach /Volumes/Speechify
          plutil -lint /Applications/Speechify.app/Contents/Info.plist
          codesign --verify --deep --strict /Applications/Speechify.app
          echo "APP=/Applications/Speechify.app/Contents/MacOS/Speechify" >> "$GITHUB_ENV"

      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./dist/speechify_*_amd64.deb desktop-file-utils
          desktop-file-validate /usr/share/applications/speechify.desktop
          echo "APP=speechify" >> "$GITHUB_ENV"
          # The AppImage is the same app in another wrapper.
          chmod +x dist/Speechify-*.AppImage
          test "$(APPIMAGE_EXTRACT_AND_RUN=1 dist/Speechify-*.AppImage --version)" = "speechify $VERSION"

      - name: Check the installed app
        run: |
          test "$("$APP" --version | tr -d '\r')" = "speechify $VERSION"
          "$APP" models
          # Creates learning.db with the teacher columns, and reads it back.
          "$APP" learn status
          # Loads PortAudio (bundled on Linux).
          "$APP" devices

      - name: Run the self-test
        run: '"$APP" selftest --engine-only --out selftest-report'

      - name: Summary
        if: always()
        run: cat selftest-report/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-package-${{ matrix.platform }}
          path: selftest-report
          retention-days: 14

  selftest:
    name: Self-test on the Windows desktop
    needs: version
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # Outside the workspace so actions/cache can keep model environments and
      # the downloaded weights between runs. Python stays out of the cache: a
      # restored copy lost its Tcl files, which the app's windows need, and
      # `uv sync` installs it again in seconds.
      SPEECHIFY_ENGINES: C:\speechify\engines
      UV_PYTHON_INSTALL_DIR: C:\uv-python
      HF_HOME: C:\speechify\hf

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Restore model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\speechify
          key: selftest-v2-${{ runner.os }}-${{ hashFiles('src/speechify/engines/catalog.py') }}

      - name: Install
        run: uv sync --frozen

      # Drives the real app: global hotkeys, the model worker, pasting into
      # Notepad, and the fix / history / model windows, with screenshots.
      - name: Run the self-test
        run: uv run --frozen speechify selftest --out selftest-report

      - name: Summary
        if: always()
        shell: bash
        run: cat selftest-report/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-report
          path: selftest-report
          retention-days: 14

  publish:
    name: Publish ${{ needs.version.outputs.channel }} release
    needs: [version, package, check-package, selftest]
    if: github.event_name == 'push' && needs.version.outputs.channel != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}

    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already released. Bump the patch version in pyproject.toml to publish a fix."
            exit 0
          fi
          prerelease=""
          [ "$CHANNEL" = nightly ] && prerelease="--prerelease"
          url="https://github.com/$GH_REPO/releases/download/$tag"
          deb_version=${VERSION/-/\~}
          notes="Download and run the installer for your system:

          - **Windows**: [Speechify-$VERSION-windows-x64-setup.exe]($url/Speechify-$VERSION-windows-x64-setup.exe)
          - **macOS** (Apple silicon): [Speechify-$VERSION-macos-arm64.dmg]($url/Speechify-$VERSION-macos-arm64.dmg)
          - **Ubuntu, Debian**: [speechify_${deb_version}_amd64.deb]($url/speechify_${deb_version}_amd64.deb)
          - **Other Linux**: [Speechify-$VERSION-x86_64.AppImage]($url/Speechify-$VERSION-x86_64.AppImage)

          To update, install the new version over the old one. Your recordings, corrections and settings are kept. See docs/releases.md for channels."
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Speechify $VERSION" \
            --notes "$notes" --generate-notes $prerelease
