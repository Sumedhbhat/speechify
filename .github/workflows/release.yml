name: Release

# Nightly prereleases come from main and stable releases from release/X.Y
# branches. Pull requests build every installer and publish nothing.
# See docs/releases.md.

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Let every push to a release branch finish so no patch release is skipped.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine version and channel
        id: version
        run: |
          # The workspace Cargo.toml is the only place the version is written.
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          case "$GITHUB_REF" in
            refs/heads/release/*)
              line="${GITHUB_REF#refs/heads/release/}"
              case "$line" in
                *.*.*) echo "Name release branches release/<major>.<minor>, not release/$line." >&2; exit 1 ;;
              esac
              case "$manifest" in
                "$line".*) ;;
                *) echo "Cargo.toml version $manifest does not belong to release/$line." >&2; exit 1 ;;
              esac
              channel=stable
              version="$manifest"
              ;;
            refs/heads/main)
              channel=nightly
              version="$manifest-nightly.$GITHUB_RUN_NUMBER"
              ;;
            *)
              channel=none
              version="$manifest-dev.$GITHUB_RUN_NUMBER"
              ;;
          esac
          echo "Building $version ($channel)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  # Pull requests run ci.yml directly.
  tests:
    name: Tests
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  package:
    name: Build ${{ matrix.platform }} installer
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            python: python3
          - platform: macos
            os: macos-15
            python: python3
          - platform: windows
            os: windows-2025
            python: python
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Read at compile time by `speechify --version` and the Settings page.
      SPEECHIFY_VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libx11-dev libxtst-dev libxi-dev
      - name: Install locked dependencies and the pinned speech runtime
        run: |
          npm ci
          "${{ matrix.python }}" scripts/fetch-native.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          npm run tauri -- build --ci --config "{\"version\":\"$VERSION\"}" --bundles deb -- --locked
          test "$(target/release/speechify --version)" = "speechify $VERSION"
          mkdir -p artifacts
          cp target/release/bundle/deb/*.deb "artifacts/Speechify-$VERSION-linux-amd64.deb"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          # Nightlies update from nightly.json; everything else from the
          # stable.json named in tauri.conf.json.
          config="{\"version\":\"$VERSION\"}"
          if [ "$CHANNEL" = nightly ]; then
            feed="https://github.com/$GITHUB_REPOSITORY/releases/download/updates/nightly.json"
            config="{\"version\":\"$VERSION\",\"plugins\":{\"updater\":{\"endpoints\":[\"$feed\"]}}}"
          fi
          npm run tauri -- build --ci --config "$config" --bundles app -- --locked
          test "$(target/release/speechify --version)" = "speechify $VERSION"

      # A separate step so the build, which runs dependency build scripts,
      # never sees the signing secrets. Pull requests get none and sign ad hoc.
      - name: Sign and package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ github.event_name == 'push' && secrets.MACOS_CERTIFICATE_P12 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # Anything that will be published must keep users' permissions.
          REQUIRE_SIGNING: ${{ needs.version.outputs.channel != 'none' && '1' || '' }}
        run: bash scripts/macos-package.sh target/release/bundle/macos/Speechify.app "$VERSION" artifacts

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          npm run tauri -- build --ci --config "{\"version\":\"$VERSION\"}" --bundles nsis -- --locked
          test "$(target/release/speechify.exe --version | tr -d '\r')" = "speechify $VERSION"
          mkdir -p artifacts
          cp target/release/bundle/nsis/*-setup.exe "artifacts/Speechify-$VERSION-windows-x64-installer.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.version.outputs.channel }} release
    needs: [version, tests, package]
    # A merge can explicitly keep build and test artifacts without publishing.
    if: github.event_name == 'push' && needs.version.outputs.channel != 'none' && !contains(github.event.head_commit.message, '[no-release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already released. Bump the patch version in Cargo.toml to publish a fix."
            exit 0
          fi
          prerelease=""
          [ "$CHANNEL" = nightly ] && prerelease="--prerelease"
          url="https://github.com/$GH_REPO/releases/download/$tag"
          notes="Download the installer for your system:

          - **Windows**: [Speechify-$VERSION-windows-x64-installer.exe]($url/Speechify-$VERSION-windows-x64-installer.exe)
          - **macOS** (Apple silicon): [Speechify-$VERSION-mac-arm64.dmg]($url/Speechify-$VERSION-mac-arm64.dmg)
          - **Ubuntu, Debian**: [Speechify-$VERSION-linux-amd64.deb]($url/Speechify-$VERSION-linux-amd64.deb)

          On macOS, Speechify updates itself: use Check for Updates in the menu bar or Settings. Elsewhere, install the new version over the old one. Your dictations, dictionary, settings and models are kept. See docs/releases.md for channels."
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Speechify $VERSION" \
            --notes "$notes" --generate-notes $prerelease

      # The app reads updates/<channel>.json. This runs after the versioned
      # release exists, also on a rerun, and never moves the feed to an older
      # version (an older release/X.Y patch, or a rerun of an old build).
      - name: Publish the update feed
        run: |
          tag="v$VERSION"
          archive="Speechify-$VERSION-mac-arm64.app.tar.gz"
          if ! gh release view updates >/dev/null 2>&1; then
            gh release create updates --target "$GITHUB_SHA" --prerelease --title "Update feed" \
              --notes "Read by Speechify's in-app updater. Not a download: get installers from the versioned releases."
          fi
          gh release download updates --pattern "$CHANNEL.json" --output current.json 2>/dev/null || true
          # The signature of the archive the release really holds: a full rerun
          # rebuilds dist/ but does not replace an existing release's files.
          gh release download "$tag" --pattern "$archive.sig" --output published.sig
          status=0
          python3 scripts/update-feed.py "$VERSION" published.sig \
            "https://github.com/$GH_REPO/releases/download/$tag/$archive" \
            "https://github.com/$GH_REPO/releases/tag/$tag" current.json > "$CHANNEL.json" || status=$?
          if [ "$status" = 3 ]; then exit 0; fi
          test "$status" = 0
          cat "$CHANNEL.json"
          gh release upload updates "$CHANNEL.json" --clobber
