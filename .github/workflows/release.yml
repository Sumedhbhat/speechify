name: Release

# Nightly prereleases come from main and stable releases from release/X.Y
# branches. Pull requests build every installer and publish nothing.
# See docs/releases.md.

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Let every push to a release branch finish so no patch release is skipped.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine version and channel
        id: version
        run: |
          # src-tauri/Cargo.toml is the only place the version is written.
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          case "$GITHUB_REF" in
            refs/heads/release/*)
              line="${GITHUB_REF#refs/heads/release/}"
              case "$line" in
                *.*.*) echo "Name release branches release/<major>.<minor>, not release/$line." >&2; exit 1 ;;
              esac
              case "$manifest" in
                "$line".*) ;;
                *) echo "src-tauri/Cargo.toml version $manifest does not belong to release/$line." >&2; exit 1 ;;
              esac
              channel=stable
              version="$manifest"
              ;;
            refs/heads/main)
              channel=nightly
              version="$manifest-nightly.$GITHUB_RUN_NUMBER"
              ;;
            *)
              channel=none
              version="$manifest-dev.$GITHUB_RUN_NUMBER"
              ;;
          esac
          echo "Building $version ($channel)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  # Pull requests run ci.yml directly.
  tests:
    name: Tests
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  package:
    name: Build ${{ matrix.platform }} installer
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            python: python3
          - platform: macos
            os: macos-15
            python: python3
          - platform: windows
            os: windows-2025
            python: python
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Read at compile time by `speechify --version` and the Settings page.
      SPEECHIFY_VERSION: ${{ needs.version.outputs.version }}
      PYTHON: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libx11-dev libxtst-dev
      - name: Install locked dependencies and the pinned native runtime
        run: |
          npm ci
          "$PYTHON" scripts/prepare-native.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          npm run tauri -- build --ci --config "{\"version\":\"$VERSION\"}" --bundles deb -- --locked
          test "$(src-tauri/target/release/speechify --version)" = "speechify $VERSION"
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb "dist/Speechify-$VERSION-linux-amd64.deb"
          python3 scripts/package-portable.py
          cp artifacts/*.tar.gz dist/

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          npm run tauri -- build --ci --config "{\"version\":\"$VERSION\"}" --bundles app -- --locked
          bundle=src-tauri/target/release/bundle/macos/Speechify.app
          test "$(src-tauri/target/release/speechify --version)" = "speechify $VERSION"
          # Ad-hoc signed until there is an Apple Developer ID.
          codesign --force --deep --sign - --entitlements src-tauri/Entitlements.plist "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          mkdir -p artifacts/dmg-stage dist
          cp -R "$bundle" artifacts/dmg-stage/
          ln -s /Applications artifacts/dmg-stage/Applications
          hdiutil create -volname Speechify -srcfolder artifacts/dmg-stage -ov -format UDZO "dist/Speechify-$VERSION-mac-arm64.dmg"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          npm run tauri -- build --ci --config "{\"version\":\"$VERSION\"}" --bundles nsis -- --locked
          test "$(src-tauri/target/release/speechify.exe --version | tr -d '\r')" = "speechify $VERSION"
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "dist/Speechify-$VERSION-windows-x64-installer.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.version.outputs.channel }} release
    needs: [version, tests, package]
    # A merge can explicitly retain build/test artifacts without publishing.
    if: github.event_name == 'push' && needs.version.outputs.channel != 'none' && !contains(github.event.head_commit.message, '[no-release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already released. Bump the patch version in src-tauri/Cargo.toml to publish a fix."
            exit 0
          fi
          prerelease=""
          [ "$CHANNEL" = nightly ] && prerelease="--prerelease"
          url="https://github.com/$GH_REPO/releases/download/$tag"
          notes="Download the installer for your system:

          - **Windows**: [Speechify-$VERSION-windows-x64-installer.exe]($url/Speechify-$VERSION-windows-x64-installer.exe)
          - **macOS** (Apple silicon): [Speechify-$VERSION-mac-arm64.dmg]($url/Speechify-$VERSION-mac-arm64.dmg)
          - **Ubuntu, Debian**: [Speechify-$VERSION-linux-amd64.deb]($url/Speechify-$VERSION-linux-amd64.deb)
          - **Other Linux** (portable): [Speechify-$VERSION-linux-x86_64.tar.gz]($url/Speechify-$VERSION-linux-x86_64.tar.gz)

          To update, install the new version over the old one. Your recordings, corrections, settings and models are kept. See docs/releases.md for channels."
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Speechify $VERSION" \
            --notes "$notes" --generate-notes $prerelease
