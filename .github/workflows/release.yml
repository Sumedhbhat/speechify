name: Release

# Nightly prereleases come from main and stable releases from release/X.Y branches.
# See docs/releases.md.

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Let every push to a release branch finish so no patch release is skipped.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version and channel
        id: version
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          case "$GITHUB_REF" in
            refs/heads/release/*)
              line="${GITHUB_REF#refs/heads/release/}"
              case "$line" in
                *.*.*) echo "Name release branches release/<major>.<minor>, not release/$line." >&2; exit 1 ;;
              esac
              case "$manifest" in
                "$line".*) ;;
                *) echo "pyproject.toml version $manifest does not belong to release/$line." >&2; exit 1 ;;
              esac
              channel=stable
              version="$manifest"
              ;;
            refs/heads/main)
              channel=nightly
              version="$manifest-nightly.$GITHUB_RUN_NUMBER"
              ;;
            *)
              channel=none
              version="$manifest-dev.$GITHUB_RUN_NUMBER"
              ;;
          esac
          echo "Building $version ($channel)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  bundle:
    name: Bundle
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Test
        run: |
          uv sync --frozen
          uv run --frozen pytest -q

      - name: Build bundle
        run: scripts/build-bundle.sh "$VERSION"

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speechify-bundle
          path: |
            dist/speechify-*.zip
            scripts/install.ps1
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify bundle (${{ matrix.os }})
    needs: [version, bundle]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: speechify-bundle
          path: bundle

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Installer parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/bundle/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      # Installs the bundle the way scripts/install.ps1 does and checks the
      # version is visible everywhere a user would look.
      - name: Install and check version
        run: |
          cd bundle
          uv run --no-project python -m zipfile -e "dist/speechify-$VERSION.zip" .
          cd "speechify-$VERSION"
          test "$(cat VERSION)" = "$VERSION"
          test "$(cat src/speechify/VERSION)" = "$VERSION"
          uv sync --frozen --no-dev
          test "$(uv run --frozen --no-dev speechify --version | tr -d '\r')" = "speechify $VERSION"

  publish:
    name: Publish ${{ needs.version.outputs.channel }} release
    needs: [version, verify]
    if: github.event_name == 'push' && needs.version.outputs.channel != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ needs.version.outputs.channel }}

    steps:
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: speechify-bundle
          path: bundle

      - name: Collect assets and checksums
        run: |
          mkdir dist
          cp bundle/dist/speechify-*.zip bundle/scripts/install.ps1 dist/
          cd dist
          sha256sum speechify-*.zip install.ps1 > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag is already released. Bump the patch version in pyproject.toml to publish a fix."
            exit 0
          fi
          prerelease=""
          channel_arg=""
          if [ "$CHANNEL" = nightly ]; then
            prerelease="--prerelease"
            channel_arg='$env:SPEECHIFY_CHANNEL = "nightly"; '
          fi
          notes="Install or update on Windows (PowerShell):

          \`\`\`powershell
          ${channel_arg}irm https://github.com/$GH_REPO/releases/download/$tag/install.ps1 | iex
          \`\`\`

          Your recordings, corrections and settings in %APPDATA%\\speechify are kept across updates. See docs/releases.md for channels."
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Speechify $VERSION" \
            --notes "$notes" --generate-notes $prerelease
