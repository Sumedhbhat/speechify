name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile
        run: uv run --frozen python -m compileall -q src scripts

      # Lets tests/test_platforms.py type through a uinput virtual keyboard
      # and read it back from /dev/input: the path Speechify uses on Wayland.
      # The setup linuxsetup.py does, minus logging out and in (sg applies the group).
      - name: Give the input group /dev/uinput
        if: runner.os == 'Linux'
        run: |
          sudo modprobe uinput || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe uinput; }
          sudo chgrp input /dev/uinput
          sudo chmod 0660 /dev/uinput
          sudo usermod -aG input "$USER"

      - name: Test
        if: runner.os != 'Linux'
        run: uv run --frozen pytest -q

      - name: Test (with the input group)
        if: runner.os == 'Linux'
        env:
          SPEECHIFY_REQUIRE_UINPUT: "1"
        run: sg input -c "uv run --frozen pytest -q"

      - name: CLI starts
        run: |
          uv run --frozen speechify --version
          uv run --frozen speechify models
          uv run --frozen speechify bench --help
          # The whole app, including the platform's keyboard and window code.
          uv run --frozen python -c "import speechify.app, speechify.history, speechify.models_ui"
