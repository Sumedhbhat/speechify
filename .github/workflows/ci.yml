name: CI

# Behavioral tests on every platform, then a gate that requires full coverage.
# Pull requests run this directly; pushes to main and release branches run it
# from release.yml, so a release is published only after it passes.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Superseded pull request runs stop; release runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libx11-dev libxtst-dev xvfb xauth xclip xdotool dbus libglib2.0-bin
      - name: Install coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo install rustfilt --version 0.2.0 --locked
          npm ci
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Check source formatting
        run: npm run format:check
      - name: Prepare isolated Wayland keyboard directory
        if: runner.os == 'Linux'
        run: |
          test ! -e /dev/input/by-id
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 700 /dev/input/by-id
      - name: Exercise application behavior and collect native coverage
        env:
          PYTHON: python
          SPEECHIFY_TEST_DISPOSABLE_DESKTOP: '1'
          SPEECHIFY_TEST_VIRTUAL_KEYBOARD: '1'
        run: bash scripts/test-coverage.sh --collect-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  coverage-gate:
    name: Tauri full coverage gate
    needs: coverage
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require passing behavioral suites on every platform
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: test "$COVERAGE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: coverage-*
          path: coverage-results
      - name: Require full coverage across supported platforms
        run: |
          cargo install rustfilt --version 0.2.0 --locked
          python3 scripts/check-coverage.py \
            --frontend coverage-results/coverage-ubuntu-24.04/coverage-final.json \
            --backend coverage-results/coverage-*/rust.info
