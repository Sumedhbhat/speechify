name: CI

# Tests on every platform, then a gate that requires full coverage.
# Each platform runs its own Test then Measure, so a slow platform does not hold
# up the others; only the coverage gate and the performance report wait for all three.
# Pull requests run this directly; pushes to main and release branches run it
# from release.yml, so a release is published only after it passes.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Superseded pull request runs stop; release runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The speech engine tests run against the real runtime and a 46 MB model.
  SPEECHIFY_REQUIRE_NATIVE: '1'
  TEST_MODEL_URL: https://huggingface.co/handy-computer/whisper-tiny.en-gguf/resolve/9dd46e00ef0577e354e658c07b3ac5580e9cd211/whisper-tiny.en-Q8_0.gguf
  TEST_MODEL_SHA256: e8c9b73c06344307d8b346e07fbe93dd88d894627854bcff31523f1ce44394fa
  TEST_TOKEN_MODEL_URL: https://huggingface.co/handy-computer/parakeet-tdt_ctc-110m-gguf/resolve/1c3f0d5378fdd358905cc410a93ed9e64f52d170/parakeet-tdt_ctc-110m-Q4_K_M.gguf
  TEST_TOKEN_MODEL_SHA256: 486414fd90185a8c8a4ced7c123cfb133ff4f7958426c6b8bd9049946b56b448
  TEST_STREAM_MODEL_URL: https://huggingface.co/handy-computer/moonshine-streaming-tiny-gguf/resolve/4125c28c22a76494162094ab3566387cd92fb2f5/moonshine-streaming-tiny-Q8_0.gguf
  TEST_STREAM_MODEL_SHA256: 930e4622ad3a24158b91406c30c977fa6a26b34cb32d6ac3e57cfb23383a869e

jobs:
  test-linux:
    name: &test-name Test (${{ matrix.os }})
    runs-on: &runner ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - &linux
            os: ubuntu-24.04
            platform: linux
            python: python3
            exe: ''
    defaults: &bash
      run:
        shell: bash
    outputs: &test-outputs
      measure: ${{ steps.plan.outputs.measure }}
      coverage: ${{ steps.plan.outputs.coverage }}
      coverage_tasks: ${{ steps.plan.outputs.coverage_tasks }}
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node packages
        run: npm ci
      - name: Plan the tasks this change affects
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/plan.mjs
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux' && (steps.plan.outputs.lint == 'true' || steps.plan.outputs.test == 'true' || steps.plan.outputs.measure == 'true')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libx11-dev libxtst-dev libxi-dev
      - name: Install the pinned Rust toolchain
        if: steps.plan.outputs.lint == 'true' || steps.plan.outputs.test == 'true' || steps.plan.outputs.measure == 'true'
        run: cargo --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.plan.outputs.fixtures == 'true'
        with:
          path: .build/models
          key: test-models-${{ env.TEST_MODEL_SHA256 }}-${{ env.TEST_TOKEN_MODEL_SHA256 }}-${{ env.TEST_STREAM_MODEL_SHA256 }}
      - name: Fetch the speech runtime and the test model
        if: steps.plan.outputs.fixtures == 'true'
        run: bash scripts/fetch-test-fixtures.sh "${{ matrix.python }}"
      - name: Fetch the speech runtime the app bundles
        if: steps.plan.outputs.fixtures != 'true' && steps.plan.outputs.native == 'true'
        run: ${{ matrix.python }} scripts/fetch-native.py
      - name: Check the project graph matches Cargo
        if: runner.os == 'Linux' && steps.plan.outputs.lint == 'true'
        run: node tools/ci/check-graph.mjs
      - name: Formatting and lints
        if: runner.os == 'Linux' && steps.plan.outputs.lint == 'true'
        run: npx moon run ${{ steps.plan.outputs.lint_tasks }}
      - name: Tests and builds
        if: steps.plan.outputs.test == 'true'
        run: |
          if [ -f .build/test-env.sh ]; then source .build/test-env.sh; fi
          npx moon run ${{ steps.plan.outputs.test_tasks }}
      - name: Build the performance binary
        if: steps.plan.outputs.measure == 'true'
        run: npx moon run perf:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.measure == 'true'
        with:
          name: perf-bin-${{ matrix.platform }}
          path: target/release/perf${{ matrix.exe }}
          retention-days: 3
          overwrite: true

  test-macos:
    name: *test-name
    runs-on: *runner
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - &macos
            os: macos-15
            platform: macos
            python: python3
            exe: ''
    outputs: *test-outputs
    defaults: *bash
    steps: *test-steps

  test-windows:
    name: *test-name
    runs-on: *runner
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - &windows
            os: windows-2025
            platform: windows
            python: python
            exe: .exe
    outputs: *test-outputs
    defaults: *bash
    steps: *test-steps

  measure-linux:
    name: &measure-name Measure (${{ matrix.platform }})
    needs: test-linux
    if: ${{ !cancelled() && needs.test-linux.outputs.measure == 'true' }}
    continue-on-error: &measure-optional ${{ github.event_name != 'pull_request' }}
    runs-on: *runner
    timeout-minutes: 60
    strategy:
      matrix:
        include: [*linux]
    defaults: *bash
    steps: &measure-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-bin-${{ matrix.platform }}
          path: .build/perf-bin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/models
          key: test-models-${{ env.TEST_MODEL_SHA256 }}-${{ env.TEST_TOKEN_MODEL_SHA256 }}-${{ env.TEST_STREAM_MODEL_SHA256 }}
      - name: Fetch the speech runtime and the test models
        run: bash scripts/fetch-test-fixtures.sh "${{ matrix.python }}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/default-models
          key: default-models-${{ hashFiles('core/defaults.json', 'core/src/catalog.rs') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/llm/llama-*
          key: llama-server-${{ runner.os }}-${{ hashFiles('perf/fetch-llm.py') }}
      - name: Fetch the language model server and model
        run: '"${{ matrix.python }}" perf/fetch-llm.py .build/llm'
      - name: Measure speed and run the scenarios
        env:
          PERF_PLATFORM: ${{ matrix.platform }}
          PERF_MODELS_DIR: .build/default-models
        run: |
          chmod +x ".build/perf-bin/perf${{ matrix.exe }}"
          source .build/test-env.sh
          mkdir -p .build/perf
          bash perf/run.sh ".build/perf-bin/perf${{ matrix.exe }}" .build/llm ".build/perf/${{ matrix.platform }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-result-${{ matrix.platform }}
          path: .build/perf/${{ matrix.platform }}.json
          retention-days: 30
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: perf-server-log-${{ matrix.platform }}-${{ github.run_attempt }}
          path: .build/llm/server.log
          retention-days: 7

  measure-macos:
    name: *measure-name
    needs: test-macos
    if: ${{ !cancelled() && needs.test-macos.outputs.measure == 'true' }}
    continue-on-error: *measure-optional
    runs-on: *runner
    timeout-minutes: 60
    strategy:
      matrix:
        include: [*macos]
    defaults: *bash
    steps: *measure-steps

  measure-windows:
    name: *measure-name
    needs: test-windows
    if: ${{ !cancelled() && needs.test-windows.outputs.measure == 'true' }}
    continue-on-error: *measure-optional
    runs-on: *runner
    timeout-minutes: 60
    strategy:
      matrix:
        include: [*windows]
    defaults: *bash
    steps: *measure-steps

  coverage-gate:
    name: Tauri full coverage gate
    needs: [test-linux, test-macos, test-windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require passing tests on every platform
        env:
          RESULTS: ${{ needs.test-linux.result }} ${{ needs.test-macos.result }} ${{ needs.test-windows.result }}
        run: test "$RESULTS" = "success success success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.test-linux.outputs.coverage == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.test-linux.outputs.coverage == 'true'
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.test-linux.outputs.coverage == 'true'
        with:
          path: .build/models
          key: test-models-${{ env.TEST_MODEL_SHA256 }}-${{ env.TEST_TOKEN_MODEL_SHA256 }}-${{ env.TEST_STREAM_MODEL_SHA256 }}
      - name: Install coverage tools
        if: needs.test-linux.outputs.coverage == 'true'
        run: |
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          npm ci
      - name: Require full coverage of the engine, the controller and the interface
        if: needs.test-linux.outputs.coverage == 'true'
        run: npx moon run ${{ needs.test-linux.outputs.coverage_tasks }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.test-linux.outputs.coverage == 'true'
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  performance:
    name: Performance report
    needs: [test-linux, measure-linux, measure-macos, measure-windows]
    if: ${{ !cancelled() && needs.test-linux.outputs.measure == 'true' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && needs.measure-linux.result == 'success' && needs.measure-macos.result == 'success' && needs.measure-windows.result == 'success')) }}
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/performance-report
        with:
          target: ${{ github.event_name == 'pull_request' && 'branch' || 'main' }}
