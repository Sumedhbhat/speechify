# Policy: security fixes ship immediately (cooldown never applies to them);
# every other new version waits 14 days after release.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily        # checked daily so a version is proposed soon after its 14 days are up
    cooldown:
      default-days: 14       # all semver levels; Dependabot's own default is only 3
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    labels: [dependencies]
