language: rust
layer: library
tags: ["engine"]

tasks:
  lint:
    script: "cargo fmt -p speechify-core --check && cargo clippy -p speechify-core --all-targets --all-features --locked -- -D warnings"
    inputs:
      - "**/*"
      - "group://rust"
      - "group://workspace"
      - "/rustfmt.toml"
  test:
    command: "cargo test -p speechify-core --locked"
    inputs:
      - "**/*"
      - "group://rust"
      - "group://workspace"
      - "group://native"
      - "$SPEECHIFY_REQUIRE_NATIVE"
  coverage:
    command: "bash scripts/coverage.sh core"
    inputs:
      - "**/*"
      - "group://rust"
      - "group://workspace"
      - "group://native"
      - "/scripts/coverage.sh"
    options:
      cache: false
      mutex: "coverage"
