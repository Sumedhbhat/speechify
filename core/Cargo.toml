[package]
name = "speechify-core"
description = "Platform-independent dictation logic: formatting, sessions, storage, insights and learning"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
regex = "=1.13.1"
ureq = { version = "=3.5.0", features = ["json"] }
sha2 = "=0.11.1"
libloading = "=0.9.0"
