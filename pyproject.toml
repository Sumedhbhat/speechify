[project]
name = "speechify"
version = "0.1.0"
description = "Hold-to-talk local dictation for Windows, Linux and macOS that learns from your corrections"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Kept small on purpose so the app starts fast. Each speech model's libraries
# live in their own environment, created on demand (src/speechify/engines).
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.5",
    "pynput>=1.7.7",
    "pyperclip>=1.9",
    "pystray>=0.19.5",  # the tray / menu bar icon
    "pillow>=13.0.0",  # draws pystray's icon
]

[dependency-groups]
build = [
    "pyinstaller>=6",
]
dev = [
    "pytest>=8",
]

[project.scripts]
speechify = "speechify.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechify"]

[tool.uv]
# uv's own Python builds, everywhere: the system Python on Debian, Ubuntu and
# Homebrew has no tkinter, which the app's windows need.
python-preference = "only-managed"

[tool.pytest.ini_options]
pythonpath = ["src"]
