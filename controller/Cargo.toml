[package]
name = "speechify-controller"
description = "The dictation state machine: shortcuts, sessions, the controller, the bar's click areas and history statistics"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
speechify-core = { path = "../core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
speechify-core = { path = "../core", features = ["fakes"] }
rusqlite = { version = "=0.42.0", features = ["bundled"] }
